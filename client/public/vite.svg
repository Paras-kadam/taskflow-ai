<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8" />

  <!-- Lightning / Zap Icon -->
  <g filter="url(#glow)">
    <polygon points="280,64 120,288 256,288 232,448 392,224 256,224" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>
